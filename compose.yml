services:
  internet-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internet-test-lanumero1
    ports:
      - "${APP_PORT:-8080}:3000"
    env_file:
      - backend/.env
    environment:
      PORT: 3000
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
